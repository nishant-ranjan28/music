name: Sync stations

# Three schedules, two days apart, each covering a slice of the catalogue.
# Splitting them keeps any one run small and keeps API use far under the
# 10,000 units/day allowance — a search costs 100 of those, so refilling
# every station at once is what exhausted the quota by hand.
#
# Membership is derived from sites/ by scripts/sync-group.mjs rather than
# listed here, so a new station cannot be left out of the rota by omission,
# and the groups rebalance themselves as the catalogue grows.
# Run `node scripts/sync-group.mjs --report` to see the current split.
#
# Each run re-checks that the station playlists still exist, drops ids that
# have become compilations or dead videos, fills whatever is missing, and
# commits the result.

on:
  schedule:
    # 08:37 UTC is 01:37 PT year-round (00:37 in winter), so each run starts
    # just after the YouTube quota resets at midnight Pacific. The previous
    # 02:23 UTC landed at 19:23 PT — the end of a Pacific day, when the day
    # quota is most likely already spent.
    - cron: "37 8 * * 1" # group A
    - cron: "37 8 * * 3" # group B
    - cron: "37 8 * * 5" # group C
  workflow_dispatch:
    inputs:
      stations:
        description: "Space-separated slugs (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sync-stations
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pick the group for this schedule
        id: group
        run: |
          case "${{ github.event.schedule }}" in
            "37 8 * * 1") STATIONS=$(node scripts/sync-group.mjs 0) ;;
            "37 8 * * 3") STATIONS=$(node scripts/sync-group.mjs 1) ;;
            "37 8 * * 5") STATIONS=$(node scripts/sync-group.mjs 2) ;;
            *)            STATIONS="${{ github.event.inputs.stations }}" ;;
          esac
          echo "stations=$STATIONS" >> "$GITHUB_OUTPUT"
          echo "Syncing: ${STATIONS:-all stations}"
          node scripts/sync-group.mjs --report

      # Playlists belong to other people and can vanish. Report but do not
      # fail the run — the ids filled below are the fallback for exactly that.
      - name: Check playlists still resolve
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node scripts/check-playlists.mjs ${{ steps.group.outputs.stations }} || true

      - name: Fill missing ids
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node scripts/fill-ids.mjs ${{ steps.group.outputs.stations }}

      # Always after filling: search picks compilations and wrong artists,
      # and this is what clears them back out.
      - name: Audit ids
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node scripts/verify-ids.mjs --fix ${{ steps.group.outputs.stations }}

      - name: Rebuild
        run: node build.mjs

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync stations: ${{ steps.group.outputs.stations }}

          Automated run — refilled missing YouTube ids and cleared any that
          had become compilations, wrong-artist matches or dead videos."
          git push
