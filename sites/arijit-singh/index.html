<body>

<div class="scene"><div class="glass" aria-hidden="true"></div>
      <div class="rain" aria-hidden="true">
        <i style="--x:9vw;--d:0s;--s:2.6s"></i><i style="--x:21vw;--d:1.1s;--s:3.1s"></i>
        <i style="--x:34vw;--d:.5s;--s:2.4s"></i><i style="--x:47vw;--d:1.7s;--s:2.9s"></i>
        <i style="--x:61vw;--d:.9s;--s:3.3s"></i><i style="--x:74vw;--d:.2s;--s:2.5s"></i>
        <i style="--x:88vw;--d:1.4s;--s:3s"></i>
      </div>
      <div class="bokeh" aria-hidden="true">
        <b style="--x:14vw;--y:64vh;--c:#45e0c8"></b><b style="--x:29vw;--y:74vh;--c:#8f7bff"></b>
        <b style="--x:52vw;--y:68vh;--c:#ff7bac"></b><b style="--x:67vw;--y:78vh;--c:#45e0c8"></b>
        <b style="--x:84vw;--y:62vh;--c:#8f7bff"></b>
      </div></div>

<main class="stage">
  <header class="masthead">
    <h1 class="sign">R A A B T A<small>arijit singh · late night · earphones in</small></h1>
    <nav class="masthead-links">
      <a href="../../index.html">all stations</a>
    </nav>
  </header>

  <section class="center">
    <div class="ambience" id="ambience" aria-hidden="true"></div>

    <div class="card">
      <div class="art" id="art"></div>

      <div class="track">
        <h2 class="track-title" id="track-title">—</h2>
        <p class="track-meta" id="track-meta"></p>
      </div>

      <div class="ticker"><span id="ticker-text"></span></div>

      <div class="progress">
        <span class="time" id="time-cur">0:00</span>
        <div class="bar" id="bar">
          <div class="progress-fill" id="progress-fill"></div>
          <div class="progress-knob" id="progress-knob"></div>
        </div>
        <span class="time" id="time-dur">&ndash;:&ndash;&ndash;</span>
      </div>

      <div class="transport">
        <button class="tbtn" id="btn-prev" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3 6l9 6V6z"/></svg>
        </button>
        <button class="tbtn tbtn--main" id="btn-play" aria-label="Play">
          <svg viewBox="0 0 24 24"><path id="icon-play" d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="tbtn" id="btn-next" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l9-6-9-6z"/></svg>
        </button>
      </div>

      <p class="status" id="status"></p>
    </div>
  </section>

  <footer class="footer">
    <span id="count"></span>
    <span id="counter" class="counter"></span>
    <span>One unread chat, city rain, and a voice that reads it out loud.</span>
  </footer>
</main>

<div class="gate" id="gate">
  <div class="gate-inner">
    <h2>Do not disturb</h2>
    <p>Phone face-down, earphones in, rain on the glass — the soundtrack of every feeling you never typed out.</p>
    <button class="gate-btn" id="gate-btn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      play
    </button>
  </div>
</div>

<div id="yt-host"></div>
