<body>

<div class="scene"><svg class="trinket" viewBox="0 0 80 220" aria-hidden="true">
        <g class="sway">
          <line x1="40" y1="0" x2="40" y2="70" stroke="#ffd400aa" stroke-width="3"/>
          <circle cx="40" cy="86" r="17" fill="#ffd40055" stroke="#ffd400ee" stroke-width="3"/>
          <path d="M40 104v42" stroke="#ff8a0088" stroke-width="3"/>
          <path d="M28 146h24l-12 34z" fill="#e4572ecc"/>
        </g>
      </svg>
      <div class="stripe" aria-hidden="true"></div>
      <div class="fare" aria-hidden="true">₹ 2 5 . 0 0</div></div>

<main class="stage">
  <header class="masthead">
    <h1 class="sign">M E T E R&nbsp;&nbsp;D O W N<small>3 sawari · no ac · full volume</small></h1>
    <nav class="masthead-links">
      <a href="../../index.html">all stations</a>
    </nav>
  </header>

  <section class="center">
    <div class="card">
      <div class="art" id="art"></div>

      <div class="track">
        <h2 class="track-title" id="track-title">—</h2>
        <p class="track-meta" id="track-meta"></p>
      </div>

      <div class="ticker"><span id="ticker-text"></span></div>

      <div class="transport">
        <button class="tbtn" id="btn-prev" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3 6l9 6V6z"/></svg>
        </button>
        <button class="tbtn tbtn--main" id="btn-play" aria-label="Play">
          <svg viewBox="0 0 24 24"><path id="icon-play" d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="tbtn" id="btn-next" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l9-6-9-6z"/></svg>
        </button>
      </div>

      <div class="volume">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
        <input type="range" id="volume" min="0" max="100" value="65" aria-label="Volume">
      </div>

      <p class="status" id="status"></p>
    </div>
  </section>

  <footer class="footer">
    <span id="count"></span>
    <span id="counter" class="counter"></span>
    <span>FM Rainbow hits at 4x volume through one blown speaker.</span>
  </footer>
</main>

<div class="gate" id="gate">
  <div class="gate-inner">
    <h2>Baith jao, chalte hain</h2>
    <p>Vinyl seat stuck to your back, a plastic god on the dashboard, and the driver's cassette on repeat since 1996.</p>
    <button class="gate-btn" id="gate-btn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      play
    </button>
  </div>
</div>

<div id="yt-host"></div>

<script src="../../shared/stations.js"></script>
