</head>
<body>

<div class="scene"><svg class="mandala" viewBox="0 0 400 400" aria-hidden="true">
        <g fill="none" stroke="#e9b44c" stroke-width="1">
          <circle cx="200" cy="200" r="150" opacity=".18"/>
          <circle cx="200" cy="200" r="120" opacity=".13"/>
          <circle cx="200" cy="200" r="92" opacity=".1"/>
        </g>
        <g fill="none" stroke="#e9b44c" opacity=".14">
          <path d="M200 50c34 42 34 108 0 150-34-42-34-108 0-150z"/>
          <path d="M200 350c34-42 34-108 0-150-34 42-34 108 0 150z"/>
          <path d="M50 200c42-34 108-34 150 0-42 34-108 34-150 0z"/>
          <path d="M350 200c-42-34-108-34-150 0 42 34 108 34 150 0z"/>
        </g>
      </svg>
      <svg class="diya" viewBox="0 0 200 120" aria-hidden="true">
        <path d="M40 62h120c0 26-27 42-60 42S40 88 40 62z" fill="#5a3d18" stroke="#e9b44c66"/>
        <path d="M34 60h132c0 5-6 8-12 8H46c-6 0-12-3-12-8z" fill="#7a5426"/>
        <g class="flicker">
          <path d="M100 14c14 16 20 26 20 34a20 20 0 0 1-40 0c0-8 6-18 20-34z"
                fill="url(#fl)"/>
        </g>
        <defs>
          <radialGradient id="fl" cx="50%" cy="75%" r="65%">
            <stop offset="0%" stop-color="#fff6d0"/>
            <stop offset="55%" stop-color="#ffb43c"/>
            <stop offset="100%" stop-color="#ff8a00" stop-opacity="0"/>
          </radialGradient>
        </defs>
      </svg>
      <div class="petals" aria-hidden="true">
        <b style="--x:16vw;--d:0s"></b><b style="--x:41vw;--d:4.5s"></b>
        <b style="--x:68vw;--d:2.2s"></b><b style="--x:88vw;--d:6.4s"></b>
      </div></div>

<main class="stage">
  <header class="masthead">
    <h1 class="sign">B H A J A N<small>aarti · chalisa · dhun</small></h1>
    <nav class="masthead-links">
      <a href="../../index.html">all stations</a>
    </nav>
  </header>

  <section class="center">
    <div class="card">
      <div class="art" id="art"></div>

      <div class="track">
        <h2 class="track-title" id="track-title">—</h2>
        <p class="track-meta" id="track-meta"></p>
      </div>

      <div class="ticker"><span id="ticker-text"></span></div>

      <div class="transport">
        <button class="tbtn" id="btn-prev" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3 6l9 6V6z"/></svg>
        </button>
        <button class="tbtn tbtn--main" id="btn-play" aria-label="Play">
          <svg viewBox="0 0 24 24"><path id="icon-play" d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="tbtn" id="btn-next" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l9-6-9-6z"/></svg>
        </button>
      </div>

      <div class="volume">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
        <input type="range" id="volume" min="0" max="100" value="65" aria-label="Volume">
      </div>

      <p class="status" id="status"></p>
    </div>
  </section>

  <footer class="footer">
    <span id="count"></span>
    <span id="counter" class="counter"></span>
    <span>Evening aarti, the Chalisa, and whatever plays after.</span>
  </footer>
</main>

<div class="gate" id="gate">
  <div class="gate-inner">
    <h2>Deepak jala dijiye</h2>
    <p>A lamp lit at dusk, an agarbatti burning down, and the same cassette of bhajans the house has played every evening for thirty years.</p>
    <button class="gate-btn" id="gate-btn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      play
    </button>
  </div>
</div>

<div id="yt-host"></div>

<script src="../../shared/stations.js"></script>
<script src="playlist.js"></script>
<script src="../../shared/player.js"></script>
<script src="../../shared/counter.js" defer></script>

</body>
</html>
