<body>

<div class="scene"><div class="sequins" aria-hidden="true"></div>
      <div class="rays" aria-hidden="true"></div>
      <div class="glitter" aria-hidden="true">
        <b style="--x:10vw;--d:0s"></b><b style="--x:29vw;--d:1.6s"></b>
        <b style="--x:51vw;--d:.8s"></b><b style="--x:68vw;--d:2.4s"></b>
        <b style="--x:88vw;--d:1.2s"></b>
      </div></div>

<main class="stage">
  <header class="masthead">
    <h1 class="sign">B H O J P U R I<small>pawan singh · khesari lal · nirahua</small></h1>
    <nav class="masthead-links">
      <a href="../../index.html">all stations</a>
    </nav>
  </header>

  <section class="center">
    <div class="ambience" id="ambience" aria-hidden="true"></div>

    <div class="card">
      <div class="art" id="art"></div>

      <div class="track">
        <h2 class="track-title" id="track-title">—</h2>
        <p class="track-meta" id="track-meta"></p>
      </div>

      <div class="ticker"><span id="ticker-text"></span></div>

      <div class="progress">
        <span class="time" id="time-cur">0:00</span>
        <div class="bar" id="bar">
          <div class="progress-fill" id="progress-fill"></div>
          <div class="progress-knob" id="progress-knob"></div>
        </div>
        <span class="time" id="time-dur">&ndash;:&ndash;&ndash;</span>
      </div>

      <div class="transport">
        <button class="tbtn" id="btn-prev" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3 6l9 6V6z"/></svg>
        </button>
        <button class="tbtn tbtn--main" id="btn-play" aria-label="Play">
          <svg viewBox="0 0 24 24"><path id="icon-play" d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="tbtn" id="btn-next" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l9-6-9-6z"/></svg>
        </button>
      </div>

      <p class="status" id="status"></p>
    </div>
  </section>

  <footer class="footer">
    <span id="count"></span>
    <span id="counter" class="counter"></span>
    <span>Sequin disco, loud speakers, and songs your landlord also knows.</span>
  </footer>
</main>

<div class="gate" id="gate">
  <div class="gate-inner">
    <h2>Speaker baaja</h2>
    <p>A wedding lawn at midnight, sequin curtain flashing pink, and the DJ playing the one song everybody demanded.</p>
    <button class="gate-btn" id="gate-btn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      play
    </button>
  </div>
</div>

<div id="yt-host"></div>

<script src="../../shared/stations.js"></script>
<script src="playlist.js"></script>

</body>
