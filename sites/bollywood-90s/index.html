<link rel="stylesheet" href="theme.css" id="theme-css">
</head>
<body>

<div class="scene"><svg class="tape" viewBox="0 0 320 200" aria-hidden="true">
        <rect x="6" y="6" width="308" height="188" rx="10" fill="#ffffff10" stroke="#ff2e88aa"/>
        <rect x="30" y="26" width="260" height="66" rx="4" fill="#22d3ee12" stroke="#22d3ee33"/>
        <g class="spin" style="transform-origin:100px 138px">
          <circle cx="100" cy="138" r="34" fill="none" stroke="#ff2e8866" stroke-width="3"/>
          <g stroke="#ff2e8899" stroke-width="4">
            <path d="M100 108v14"/><path d="M100 154v14"/><path d="M70 138h14"/><path d="M116 138h14"/>
          </g>
        </g>
        <g class="spin" style="transform-origin:220px 138px">
          <circle cx="220" cy="138" r="34" fill="none" stroke="#22d3ee66" stroke-width="3"/>
          <g stroke="#22d3ee99" stroke-width="4">
            <path d="M220 108v14"/><path d="M220 154v14"/><path d="M190 138h14"/><path d="M236 138h14"/>
          </g>
        </g>
        <rect x="128" y="120" width="64" height="36" fill="#00000055" stroke="#ffffff22"/>
      </svg>
      <div class="grid" aria-hidden="true"></div></div>

<main class="stage">
  <header class="masthead">
    <h1 class="sign">T-SERIES&nbsp;&nbsp;90s<small>side a · dolby · rewind with a pencil</small></h1>
    <nav class="masthead-links">
      <a href="../../index.html">all stations</a>
    </nav>
  </header>

  <section class="center">
    <div class="card">
      <div class="art" id="art"></div>

      <div class="track">
        <h2 class="track-title" id="track-title">—</h2>
        <p class="track-meta" id="track-meta"></p>
      </div>

      <div class="ticker"><span id="ticker-text"></span></div>

      <div class="transport">
        <button class="tbtn" id="btn-prev" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3 6l9 6V6z"/></svg>
        </button>
        <button class="tbtn tbtn--main" id="btn-play" aria-label="Play">
          <svg viewBox="0 0 24 24"><path id="icon-play" d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="tbtn" id="btn-next" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l9-6-9-6z"/></svg>
        </button>
      </div>

      <div class="volume">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
        <input type="range" id="volume" min="0" max="100" value="65" aria-label="Volume">
      </div>

      <p class="status" id="status"></p>
    </div>
  </section>

  <footer class="footer">
    <span id="count"></span>
    <span>One cassette, both sides, played until the tape stretched.</span>
  </footer>
</main>

<div class="gate" id="gate">
  <div class="gate-inner">
    <h2>Side A</h2>
    <p>Bought from a shop with a hand-written inlay card. The chorus was always slightly warped by the third month.</p>
    <button class="gate-btn" id="gate-btn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      play
    </button>
  </div>
</div>

<div id="yt-host"></div>

<script src="../../shared/stations.js"></script>
<script src="playlist.js"></script>
<script src="../../shared/player.js"></script>

</body>
</html>
