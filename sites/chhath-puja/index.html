<body>

<div class="scene"><div class="ghat-sun" aria-hidden="true"></div>
      <div class="horizon" aria-hidden="true"></div>
      <div class="water-shimmer" aria-hidden="true"></div>
      <div class="diyas" aria-hidden="true">
        <b style="--x:18vw;--d:0s"></b><b style="--x:36vw;--d:2.8s"></b>
        <b style="--x:54vw;--d:1.4s"></b><b style="--x:72vw;--d:4.2s"></b>
        <b style="--x:86vw;--d:5.6s"></b>
      </div></div>

<main class="stage">
  <header class="masthead">
    <h1 class="sign">C H H A T H<small>soop · thekua · arghya to the sun</small></h1>
    <nav class="masthead-links">
      <a href="../../index.html">all stations</a>
    </nav>
  </header>

  <section class="center">
    <div class="ambience" id="ambience" aria-hidden="true"></div>

    <div class="card">
      <div class="art" id="art"></div>

      <div class="track">
        <h2 class="track-title" id="track-title">—</h2>
        <p class="track-meta" id="track-meta"></p>
      </div>

      <div class="ticker"><span id="ticker-text"></span></div>

      <div class="progress">
        <span class="time" id="time-cur">0:00</span>
        <div class="bar" id="bar">
          <div class="progress-fill" id="progress-fill"></div>
          <div class="progress-knob" id="progress-knob"></div>
        </div>
        <span class="time" id="time-dur">&ndash;:&ndash;&ndash;</span>
      </div>

      <div class="transport">
        <button class="tbtn" id="btn-prev" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3 6l9 6V6z"/></svg>
        </button>
        <button class="tbtn tbtn--main" id="btn-play" aria-label="Play">
          <svg viewBox="0 0 24 24"><path id="icon-play" d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="tbtn" id="btn-next" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l9-6-9-6z"/></svg>
        </button>
      </div>

      <p class="status" id="status"></p>
    </div>
  </section>

  <footer class="footer">
    <span id="count"></span>
    <span id="counter" class="counter"></span>
    <span>Waist-deep in the river, offering the last light to the sun.</span>
  </footer>
</main>

<div class="gate" id="gate">
  <div class="gate-inner">
    <h2>Suraj ko arghya</h2>
    <p>Standing at the ghat as the sun goes down, a bamboo soop of thekua held steady, water still warm from the day.</p>
    <button class="gate-btn" id="gate-btn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      play
    </button>
  </div>
</div>

<div id="yt-host"></div>
