<link rel="stylesheet" href="theme.css" id="theme-css">
</head>
<body>

<div class="scene"><svg class="sun" viewBox="0 0 300 300" aria-hidden="true">
        <circle cx="150" cy="150" r="52" fill="#ffb02033" stroke="#ffb02088" stroke-width="2"/>
        <g class="rays" stroke="#ffb02055" stroke-width="7" stroke-linecap="round">
          <path d="M150 18v40"/><path d="M150 242v40"/>
          <path d="M18 150h40"/><path d="M242 150h40"/>
          <path d="M57 57l28 28"/><path d="M215 215l28 28"/>
          <path d="M243 57l-28 28"/><path d="M85 215l-28 28"/>
        </g>
      </svg>
      <div class="motes" aria-hidden="true">
        <b style="--x:12vw;--d:0s"></b><b style="--x:29vw;--d:3.4s"></b>
        <b style="--x:47vw;--d:1.7s"></b><b style="--x:66vw;--d:5.1s"></b>
        <b style="--x:84vw;--d:2.6s"></b><b style="--x:94vw;--d:6.2s"></b>
      </div></div>

<main class="stage">
  <header class="masthead">
    <h1 class="sign">K H U S H I<small>90s · 00s · 10s · sing-along</small></h1>
    <nav class="masthead-links">
      <a href="../../index.html">all stations</a>
    </nav>
  </header>

  <section class="center">
    <div class="card">
      <div class="art" id="art"></div>

      <div class="track">
        <h2 class="track-title" id="track-title">—</h2>
        <p class="track-meta" id="track-meta"></p>
      </div>

      <div class="ticker"><span id="ticker-text"></span></div>

      <div class="transport">
        <button class="tbtn" id="btn-prev" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3 6l9 6V6z"/></svg>
        </button>
        <button class="tbtn tbtn--main" id="btn-play" aria-label="Play">
          <svg viewBox="0 0 24 24"><path id="icon-play" d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="tbtn" id="btn-next" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l9-6-9-6z"/></svg>
        </button>
      </div>

      <div class="volume">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
        <input type="range" id="volume" min="0" max="100" value="65" aria-label="Volume">
      </div>

      <p class="status" id="status"></p>
    </div>
  </section>

  <footer class="footer">
    <span id="count"></span>
    <span id="counter" class="counter"></span>
    <span>The ones everybody still knows every word of.</span>
  </footer>
</main>

<div class="gate" id="gate">
  <div class="gate-inner">
    <h2>Awaaz thodi tez</h2>
    <p>Birthday car rides, hostel corridors, the wedding after-party at 1am — the songs that were always already playing when you walked in.</p>
    <button class="gate-btn" id="gate-btn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      play
    </button>
  </div>
</div>

<div id="yt-host"></div>

<script src="../../shared/stations.js"></script>
<script src="playlist.js"></script>
<script src="../../shared/player.js"></script>
<script src="../../shared/counter.js" defer></script>

<script type="module">
  import { inject } from '../../node_modules/@vercel/analytics/dist/index.js';
  inject();
</script>
</body>
</html>
