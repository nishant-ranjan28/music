<body>

<div class="scene"><div class="bulb flicker" aria-hidden="true"></div>
      <div class="packets" aria-hidden="true">
        <i class="sway" style="--d:0s"></i><i class="sway" style="--d:.4s"></i>
        <i class="sway" style="--d:.9s"></i><i class="sway" style="--d:1.3s"></i>
        <i class="sway" style="--d:1.8s"></i><i class="sway" style="--d:2.2s"></i>
      </div>
      <svg class="scale" viewBox="0 0 220 160" aria-hidden="true">
        <path d="M110 20v70" stroke="#e9a23b66" stroke-width="3"/>
        <path d="M40 90h140" stroke="#e9a23b66" stroke-width="3"/>
        <path d="M40 90l-16 26h32z" fill="#e9a23b22" stroke="#e9a23b55"/>
        <path d="M180 90l-16 26h32z" fill="#e9a23b22" stroke="#e9a23b55"/>
        <rect x="94" y="120" width="32" height="26" fill="#e9a23b1a" stroke="#e9a23b44"/>
      </svg></div>

<main class="stage">
  <header class="masthead">
    <h1 class="sign">K I R A N A<small>udhaar band hai · cash only</small></h1>
    <nav class="masthead-links">
      <a href="../../index.html">all stations</a>
    </nav>
  </header>

  <section class="center">
    <div class="card">
      <div class="art" id="art"></div>

      <div class="track">
        <h2 class="track-title" id="track-title">—</h2>
        <p class="track-meta" id="track-meta"></p>
      </div>

      <div class="ticker"><span id="ticker-text"></span></div>

      <div class="transport">
        <button class="tbtn" id="btn-prev" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3 6l9 6V6z"/></svg>
        </button>
        <button class="tbtn tbtn--main" id="btn-play" aria-label="Play">
          <svg viewBox="0 0 24 24"><path id="icon-play" d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="tbtn" id="btn-next" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l9-6-9-6z"/></svg>
        </button>
      </div>

      <div class="volume">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
        <input type="range" id="volume" min="0" max="100" value="65" aria-label="Volume">
      </div>

      <p class="status" id="status"></p>
    </div>
  </section>

  <footer class="footer">
    <span id="count"></span>
    <span>Vividh Bharati crackling over glass jars and hanging chip packets.</span>
  </footer>
</main>

<div class="gate" id="gate">
  <div class="gate-inner">
    <h2>Ek Parle-G dena</h2>
    <p>The transistor on the top shelf never turned off. Jingles, film songs, and the sound of a weighing scale settling.</p>
    <button class="gate-btn" id="gate-btn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      play
    </button>
  </div>
</div>

<div id="yt-host"></div>

<script src="playlist.js"></script>
<script src="../../shared/player.js"></script>

</body>
</html>
