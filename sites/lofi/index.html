<body>

<div class="scene"><div class="window" aria-hidden="true"></div>
      <div class="rain" aria-hidden="true">
        <i style="--x:8vw;--d:0s;--s:.9s"></i><i style="--x:19vw;--d:.4s;--s:1.1s"></i>
        <i style="--x:31vw;--d:.15s;--s:.8s"></i><i style="--x:44vw;--d:.7s;--s:1.2s"></i>
        <i style="--x:58vw;--d:.25s;--s:.95s"></i><i style="--x:69vw;--d:.55s;--s:1.05s"></i>
        <i style="--x:81vw;--d:.1s;--s:.85s"></i><i style="--x:92vw;--d:.65s;--s:1.15s"></i>
      </div></div>

<main class="stage">
  <header class="masthead">
    <h1 class="sign">l o f i&nbsp;&nbsp; r a i n<small>tape hiss · rain · no vocals</small></h1>
    <nav class="masthead-links">
      <a href="../../index.html">all stations</a>
    </nav>
  </header>

  <section class="center">
    <div class="card">
      <div class="art" id="art"></div>

      <div class="track">
        <h2 class="track-title" id="track-title">—</h2>
        <p class="track-meta" id="track-meta"></p>
      </div>

      <div class="ticker"><span id="ticker-text"></span></div>

      <div class="transport">
        <button class="tbtn" id="btn-prev" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3 6l9 6V6z"/></svg>
        </button>
        <button class="tbtn tbtn--main" id="btn-play" aria-label="Play">
          <svg viewBox="0 0 24 24"><path id="icon-play" d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="tbtn" id="btn-next" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l9-6-9-6z"/></svg>
        </button>
      </div>

      <div class="volume">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
        <input type="range" id="volume" min="0" max="100" value="65" aria-label="Volume">
      </div>

      <p class="status" id="status"></p>
    </div>
  </section>

  <footer class="footer">
    <span id="count"></span>
    <span id="counter" class="counter"></span>
    <span>Rain on the window, a tape loop, and homework you never finished.</span>
  </footer>
</main>

<div class="gate" id="gate">
  <div class="gate-inner">
    <h2>Stay in</h2>
    <p>Lamp on, blinds half down, and a beat that never resolves. Meant to be left playing while you do something else.</p>
    <button class="gate-btn" id="gate-btn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      play
    </button>
  </div>
</div>

<div id="yt-host"></div>

<script src="../../shared/stations.js"></script>
<script src="playlist.js"></script>
<script src="../../shared/player.js"></script>
<script src="../../shared/counter.js" defer></script>

</body>
</html>
