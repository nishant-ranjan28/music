<body>

<div class="scene"><svg class="jali" viewBox="0 0 420 420" aria-hidden="true">
        <defs>
          <pattern id="j" width="60" height="60" patternUnits="userSpaceOnUse">
            <path d="M30 2 58 30 30 58 2 30z" fill="none" stroke="#d4af3733"/>
            <circle cx="30" cy="30" r="9" fill="none" stroke="#d4af3722"/>
          </pattern>
        </defs>
        <rect width="420" height="420" fill="url(#j)"/>
      </svg>
      <div class="chandelier" aria-hidden="true">
        <i style="--d:0s"></i><i style="--d:.5s"></i><i style="--d:1s"></i>
        <i style="--d:1.5s"></i><i style="--d:2s"></i>
      </div>
      <div class="petals" aria-hidden="true">
        <b style="--x:14vw;--d:0s"></b><b style="--x:37vw;--d:2.6s"></b>
        <b style="--x:62vw;--d:1.3s"></b><b style="--x:86vw;--d:3.9s"></b>
      </div></div>

<main class="stage">
  <header class="masthead">
    <h1 class="sign">Q A W W A L I<small>harmonium · taali · chorus</small></h1>
    <nav class="masthead-links">
      <a href="../../index.html">all stations</a>
    </nav>
  </header>

  <section class="center">
    <div class="card">
      <div class="art" id="art"></div>

      <div class="track">
        <h2 class="track-title" id="track-title">—</h2>
        <p class="track-meta" id="track-meta"></p>
      </div>

      <div class="ticker"><span id="ticker-text"></span></div>

      <div class="transport">
        <button class="tbtn" id="btn-prev" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3 6l9 6V6z"/></svg>
        </button>
        <button class="tbtn tbtn--main" id="btn-play" aria-label="Play">
          <svg viewBox="0 0 24 24"><path id="icon-play" d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="tbtn" id="btn-next" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l9-6-9-6z"/></svg>
        </button>
      </div>

      <div class="volume">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
        <input type="range" id="volume" min="0" max="100" value="65" aria-label="Volume">
      </div>

      <p class="status" id="status"></p>
    </div>
  </section>

  <footer class="footer">
    <span id="count"></span>
    <span id="counter" class="counter"></span>
    <span>Thursday night at the dargah, hands clapping on the offbeat.</span>
  </footer>
</main>

<div class="gate" id="gate">
  <div class="gate-inner">
    <h2>Baithiye</h2>
    <p>Green chadar, rose petals, a harmonium wheezing to life, and a chorus that keeps climbing until nobody is sitting still.</p>
    <button class="gate-btn" id="gate-btn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      play
    </button>
  </div>
</div>
