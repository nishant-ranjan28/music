<head>

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="mask-icon" href="favicon.svg" color="#e8b33c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;500&display=swap" id="theme-fonts">
<link rel="stylesheet" href="../../shared/base.css">
<link rel="stylesheet" href="theme.css" id="theme-css">
</head>
<body>

<div class="scene"><div class="grille" aria-hidden="true"></div>
      <div class="glow" aria-hidden="true"></div>
      <svg class="vu" viewBox="0 0 240 130" aria-hidden="true">
        <rect x="2" y="2" width="236" height="126" rx="6" fill="#e8b33c0e" stroke="#e8b33c44"/>
        <path d="M28 104a92 92 0 0 1 184 0" fill="none" stroke="#e8b33c55" stroke-width="2"/>
        <path d="M186 40l22-14" stroke="#c0392b88" stroke-width="2"/>
        <g class="needle"><path d="M120 104V34" stroke="#f0e7d6" stroke-width="2.5"/></g>
        <circle cx="120" cy="104" r="6" fill="#e8b33c"/>
      </svg></div>

<main class="stage">
  <header class="masthead">
    <h1 class="sign">VALVE&nbsp;&nbsp;RADIO<small>tolex · tubes · vu meter</small></h1>
    <nav class="masthead-links">
      <a href="../../index.html">all stations</a>
    </nav>
  </header>

  <section class="center">
    <div class="card">
      <div class="art" id="art"></div>

      <div class="track">
        <h2 class="track-title" id="track-title">—</h2>
        <p class="track-meta" id="track-meta"></p>
      </div>

      <div class="ticker"><span id="ticker-text"></span></div>

      <div class="transport">
        <button class="tbtn" id="btn-prev" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3 6l9 6V6z"/></svg>
        </button>
        <button class="tbtn tbtn--main" id="btn-play" aria-label="Play">
          <svg viewBox="0 0 24 24"><path id="icon-play" d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="tbtn" id="btn-next" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l9-6-9-6z"/></svg>
        </button>
      </div>

      <div class="volume">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
        <input type="range" id="volume" min="0" max="100" value="65" aria-label="Volume">
      </div>

      <p class="status" id="status"></p>
    </div>
  </section>

  <footer class="footer">
    <span id="count"></span>
    <span id="counter" class="counter"></span>
    <span>One amp, warm glass tubes, and the riffs your father still air-guitars.</span>
  </footer>
</main>

<div class="gate" id="gate">
  <div class="gate-inner">
    <h2>Turn it up</h2>
    <p>Cream tolex, a needle that never sits still, and a valve glow you could read by. Volume knob only goes one way.</p>
    <button class="gate-btn" id="gate-btn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      play
    </button>
  </div>
</div>

<div id="yt-host"></div>

<script src="../../shared/stations.js"></script>
<script src="playlist.js"></script>
<script src="../../shared/player.js"></script>
<script src="../../shared/counter.js" defer></script>

</body>
</html>
