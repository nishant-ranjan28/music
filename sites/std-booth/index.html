<link rel="stylesheet" href="../../shared/base.css">
<link rel="stylesheet" href="theme.css" id="theme-css">
</head>
<body>

<div class="scene"><div class="meter" aria-hidden="true">
        <em>PULSE</em><b id="pulse">0 0 7</b>
      </div>
      <svg class="phone" viewBox="0 0 200 140" aria-hidden="true">
        <rect x="26" y="66" width="148" height="58" rx="9" fill="#33260f" stroke="#f7c94877"/>
        <g fill="#f7c94855">
          <circle cx="60" cy="86" r="7"/><circle cx="84" cy="86" r="7"/><circle cx="108" cy="86" r="7"/>
          <circle cx="60" cy="106" r="7"/><circle cx="84" cy="106" r="7"/><circle cx="108" cy="106" r="7"/>
        </g>
        <rect x="132" y="78" width="30" height="36" rx="4" fill="#f7c94840"/>
        <path d="M34 44h132a14 14 0 0 1 14 14v6H20v-6a14 14 0 0 1 14-14z" fill="#4a3517" stroke="#f7c94877"/>
      </svg></div>

<main class="stage">
  <header class="masthead">
    <h1 class="sign">S T D · I S D · P C O<small>local · national · international</small></h1>
    <nav class="masthead-links">
      <a href="../../index.html">all stations</a>
    </nav>
  </header>

  <section class="center">
    <div class="card">
      <div class="art" id="art"></div>

      <div class="track">
        <h2 class="track-title" id="track-title">—</h2>
        <p class="track-meta" id="track-meta"></p>
      </div>

      <div class="ticker"><span id="ticker-text"></span></div>

      <div class="transport">
        <button class="tbtn" id="btn-prev" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3 6l9 6V6z"/></svg>
        </button>
        <button class="tbtn tbtn--main" id="btn-play" aria-label="Play">
          <svg viewBox="0 0 24 24"><path id="icon-play" d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="tbtn" id="btn-next" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l9-6-9-6z"/></svg>
        </button>
      </div>

      <div class="volume">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
        <input type="range" id="volume" min="0" max="100" value="65" aria-label="Volume">
      </div>

      <p class="status" id="status"></p>
    </div>
  </section>

  <footer class="footer">
    <span id="count"></span>
    <span>The songs that played while you waited for the meter to stop.</span>
  </footer>
</main>

<div class="gate" id="gate">
  <div class="gate-inner">
    <h2>Pick up the receiver</h2>
    <p>Before unlimited calls, love travelled at ₹1.20 a pulse. Yellow board, plastic phone, one song on the shopkeeper's radio.</p>
    <button class="gate-btn" id="gate-btn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      play
    </button>
  </div>
</div>

<div id="yt-host"></div>

<script src="../../shared/stations.js"></script>
<script src="playlist.js"></script>
<script src="../../shared/player.js"></script>
<script>var p=document.getElementById('pulse');
      if(p){var n=7;setInterval(function(){n++;p.textContent=String(n).padStart(3,'0').split('').join(' ');},4000);}</script>
</body>
</html>
